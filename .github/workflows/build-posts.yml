name: Build posts

# Runs whenever you add/edit a Markdown post (or the build script itself),
# regenerates data/posts.json and the blog/<id>/ share pages, and commits
# them back. Cloudflare Pages then deploys that commit as usual — no build
# command needed on Cloudflare's side, the files are already generated here.

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "scripts/build-posts.mjs"
      - "package.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build:posts

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json blog/
          git diff --cached --quiet || git commit -m "Build posts [auto]"
          git push
